<!DOCTYPE html>
<html lang="uk">
<head>
    <!--Встановлює кодування сторінки-->
    <meta charset="UTF-8">
    <!--Назва сторінки-->
    <title>Списки</title>
</head>
<body>
    <!-- Заголовок сторінки -->
    <h1>Списки</h1>
    <!-- Невпорядкований список -->
    <h2>Невпорядкований список (ul)</h2>
    <ul>
        <li>Яблука</li>
        <li>Банани</li>
        <li>Апельсини</li>
    </ul>
    <!-- Впорядкований список -->
    <h2>Впорядкований список (ol)</h2>
    <ol>
        <li>Прокинутись</li>
        <li>Вмитись</li>
        <li>Поснідати</li>
    </ol>
    <!-- Список описів -->
    <h2>Список описів (dl)</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Мова розмітки для створення веб-сторінок.</dd>
        <dt>CSS</dt>
        <dd>Мова стилів для оформлення веб-сторінок.</dd>
    </dl>
</body>
</html>
