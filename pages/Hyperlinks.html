<!DOCTYPE html>
<html lang="uk">
<head>
    <!--Встановлює кодування сторінки-->
    <meta charset="UTF-8">
    <!--Назва сторінки-->
    <title>Гіперпосилання</title>
</head>
<body>
    <!-- Заголовок сторінки -->
    <h1>Гіперпосилання</h1>
    <!-- Перехід на головну сторінку -->
    <nav>
        <a href="./index.html">Головна</a>
    </nav>
        <!-- Звичайне посилання (href) -->
        <p>
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Музикальний кліп</a>
        </p>
        <!-- Завантаження файлу (download) -->
        <p>
            <a href="./images/pexels-akos-szabo-145938-440731.jpg" download>Завантажити картинку пейзажу</a>
        </p>
        <!-- Відкриття посилання в новій вкладці (target="_blank") -->
        <p>
            <a href="https://developer.mozilla.org/uk/docs/Web/HTML" target="_blank">
                Документація HTML (відкривається в новій вкладці)
            </a>
        </p>
</body>
</html>
